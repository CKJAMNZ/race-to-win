<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Race to Win</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#123;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,#1b3a8c,#3a1670 60%,#7a1a55);padding:16px;touch-action:pan-y}
#ui.hide{display:none}
h1{font-size:44px;margin:6px 0;text-align:center;text-shadow:0 4px 0 #0006;letter-spacing:1px}
h2{margin:6px 0 10px;font-size:28px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:center}
.btn{font:inherit;font-size:22px;font-weight:800;border:0;border-radius:18px;padding:14px 20px;margin:5px;color:#222;background:#ffd23f;box-shadow:0 5px 0 #b38900;cursor:pointer;min-width:120px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b38900}
.btn.blue{background:#5bd0ff;box-shadow:0 5px 0 #1b7fa8}.btn.green{background:#6cf08a;box-shadow:0 5px 0 #2a9c47}
.btn.red{background:#ff7a8a;box-shadow:0 5px 0 #b0384a}.btn.grey,.btn:disabled{background:#999;box-shadow:0 5px 0 #555;color:#333}
.btn.small{font-size:16px;padding:8px 12px;min-width:0;border-radius:12px}
.card{background:#0005;border-radius:18px;padding:12px;margin:6px;min-width:200px;flex:1 1 220px;max-width:330px}
.card.on{outline:4px solid #ffd23f}
.money{position:fixed;top:10px;right:14px;background:#0008;border-radius:14px;padding:8px 14px;font-size:22px;font-weight:800;z-index:5}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tab{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:12px;padding:10px 14px;background:#fff3;color:#fff}
.tab.on{background:#ffd23f;color:#222}
.bar{height:16px;background:#0006;border-radius:8px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6cf08a,#ffd23f)}
.lock{opacity:.6}.muted{opacity:.8;font-size:15px}.big{font-size:26px;font-weight:800}
#pad{position:fixed;inset:0;pointer-events:none;display:none}
#pad .tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;font:inherit;font-weight:900;color:#fff;background:#0007;border:4px solid #fff8;font-size:20px;display:flex;align-items:center;justify-content:center}
#pad .tb[data-k=rocket]{background:#ff3b3bcc;border-color:#ffd23f;font-size:18px}#pad .tb.used{opacity:.35}
#pad .tb.down{background:#ffd23fcc;color:#222}
#pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:#000c;padding:20px 28px;border-radius:20px;font-size:26px;font-weight:800;text-align:center;display:none;z-index:9;max-width:90vw}
table.odds{border-collapse:collapse;font-size:17px}table.odds td{padding:3px 8px}
</style></head><body>
<canvas id="cv"></canvas>
<div id="pad"></div>

<script>
'use strict';
/* =====================================================================
   RACE TO WIN  -  designed by Archer, Round 2 build.
   Everything a parent might want to tweak lives in the three config
   objects right below: ECONOMY (money), LUCK (prizes), DIFFICULTY (bots).
   ===================================================================== */

// ---------- ECONOMY: every price and payout in the game ----------
const ECONOMY = {
  startMoney: 1000,          // everyone starts with $1,000 (Archer, 22 Oct)
  dailyCash: 100,            // daily reward cash (plus one wheel spin)
  paintPrice: 50,            // one paint job
  patchPrice: 250,           // a ruby gem patch fixes any broken part
  // Car prices live in the CARS list below. Starter cars are $300-$700,
  // so $1,000 buys a car AND a part. Next car step is $1,500 (~5 races).
  partPrice: { normal: 100, gold: 300, diamond: 800, amethyst: 2000, ruby: 5000 },
  upgradeDiscount: 0.5,      // upgrading in place costs: next tier price minus half of current price
  sellBack: 0.5,             // selling gives back half of what it costs
  placePrize: [200, 120, 80, 50],  // cash for 1st, 2nd, 3rd, 4th
  mapBonus: { grass: 1, desert: 1.3, city: 1.7, space: 2.2 }, // harder maps pay more
  lapBonus: 0.25,            // each lap beyond 2 adds +25% to the place prize
  coinValue: 5,              // each coin picked up on the track
  polePrize: 25,             // fastest qualifying lap
  practicePrize: 100,        // passing the practice test (once)
  pit: { fuel: 10, tire: 100, rubyTire: 1000 },  // from the design doc
  fixOtherPart: 0.25,        // fixing a broken boost/wing/horn costs 25% of its price
  trophyWeekly: { normal: 50, gold: 100, diamond: 120, amethyst: 150, ruby: 200 }, // paid every 7 days per trophy
  trophySell: { normal: 50, gold: 150, diamond: 400, amethyst: 1000, ruby: 20000 },
  // chance that an equipped part breaks during one race (gold lasts ~2,000 races per the doc)
  breakChance: { normal: 0.08, gold: 0.0005, diamond: 0.03, amethyst: 0.02, ruby: 0.02 },
  prizeTiers: { grass: ['normal', 'gold'], desert: ['gold', 'gold', 'diamond'], city: ['gold', 'diamond'], space: ['diamond', 'amethyst'] },
};

// ---------- LUCK: ONE weighted table for the daily wheel AND lucky blocks ----------
// w.wheel / w.block = "tickets in the hat". Ruby is 1 ticket out of 100 in both (Archer's rule).
const LUCK = {
  table: [
    { id: 'cash50',   label: '$50',           icon: '💵', w: { wheel: 26 } },
    { id: 'cash150',  label: '$150',          icon: '💰', w: { wheel: 12 } },
    { id: 'paint',    label: 'Free paint',    icon: '🎨', w: { wheel: 10 } },
    { id: 'patch',    label: 'Ruby patch',    icon: '🩹', w: { wheel: 6 } },
    { id: 'shield',   label: 'Shield (20s)',  icon: '🛡️', w: { block: 25 } },
    { id: 'goo',      label: 'Goo blob',      icon: '🟢', w: { block: 25 } },
    { id: 'zoom',     label: 'Zoom!',         icon: '⚡', w: { block: 20 } },
    { id: 'cash25',   label: '$25',           icon: '🪙', w: { block: 15 } },
    { id: 'normal',   label: 'Normal part',   icon: '⚪', w: { wheel: 23 } },
    { id: 'gold',     label: 'Gold part',     icon: '🟡', w: { wheel: 13, block: 8 }, rainbow: 2 },
    { id: 'diamond',  label: 'Diamond part',  icon: '💎', w: { wheel: 6, block: 4 }, rare: true, rainbow: 1.6 },
    { id: 'amethyst', label: 'Amethyst part', icon: '🟣', w: { wheel: 3, block: 2 }, rare: true, rainbow: 1.4 },
    { id: 'ruby',     label: 'Ruby part',     icon: '🔴', w: { wheel: 1, block: 1 }, rare: true },   // super rare, 1 in 100
  ],
  pityAfter: 8,     // 8 wheel spins with nothing rare -> next spin is a diamond or amethyst part for sure
  rubyPity: 100,    // 100 wheel spins with no ruby -> next spin is a ruby
};

// ---------- DIFFICULTY: how fast the robot racers are ----------
// 1.0 = exactly as fast as a starter car's top speed.
const DIFFICULTY = {
  levels: { easy: 0.88, normal: 1.0, hard: 1.1 },   // Options menu (not used for the practice bot)
  practiceBot: 0.70,                                 // the practice-test bot: very beatable
  mapSkill: {                                        // three bots per real race
    grass:  [0.76, 0.81, 0.86],
    desert: [0.82, 0.88, 0.93],
    city:   [0.88, 0.94, 1.00],
    space:  [0.95, 1.02, 1.08],
  },
  rubberBand: { slowAhead: 0.06, helpBehind: 0.04, range: 6000 }, // gentle: at most 6% slower / 4% faster
  laps: { practice: 2, grass: 2, desert: 2, city: 3, space: 3 },
};

// ---------- Game data ----------
const TIERS = ['normal', 'gold', 'diamond', 'amethyst', 'ruby'];
const TIER_ICON = { normal: '⚪', gold: '🟡', diamond: '💎', amethyst: '🟣', ruby: '🔴' };
const TIER_COLOR = { normal: '#2b2b2b', gold: '#e6b422', diamond: '#7fe6ff', amethyst: '#a95cff', ruby: '#ff2a4d' };
const TIER_STATS = { turbo: [4, 5, 6, 8, 10], fuel: [35, 30, 22, 18, 10], glide: [0.4, 0.7, 1.0, 1.3, 1.6] };
const CARS = [ // speed = top speed multiplier; handle/grip around 1
  { id: 'bug',    name: 'Mini Bug',       price: 300,  speed: 0.97, handle: 1.15, grip: 1.05, shape: 'bug' },
  { id: 'zoom',   name: 'Zoomer',         price: 450,  speed: 1.00, handle: 1.0,  grip: 1.0,  shape: 'car' },
  { id: 'ghost',  name: 'Ghost Car',      price: 600,  speed: 1.00, handle: 1.0,  grip: 1.0,  shape: 'ghost', ghost: true },
  { id: 'truck',  name: 'Monster Truck',  price: 700,  speed: 0.98, handle: 0.9,  grip: 1.3,  shape: 'truck' },
  { id: 'bolt',   name: 'Lightning Bolt', price: 1500, speed: 1.08, handle: 1.05, grip: 1.0,  shape: 'car',    un: { races: 3 } },
  { id: 'shark',  name: 'Shark Car',      price: 2200, speed: 1.13, handle: 1.1,  grip: 1.05, shape: 'shark',  un: { wins: 2 } },
  { id: 'police', name: 'Police Cruiser', price: 3000, speed: 1.17, handle: 1.2,  grip: 1.15, shape: 'police', un: { races: 10 } },
  { id: 'hover',  name: 'Hover Car',      price: 4500, speed: 1.22, handle: 1.2,  grip: 1.2,  shape: 'hover',  un: { wins: 5 }, fly: 1 },
  { id: 'dragon', name: 'Dragon Racer',   price: 7000, speed: 1.28, handle: 1.15, grip: 1.2,  shape: 'dragon', un: { wins: 8 } },
  { id: 'unicorn',name: 'Unicorn Speedster', price: 10000, speed: 1.34, handle: 1.25, grip: 1.25, shape: 'unicorn', un: { wins: 12 } },
  { id: 'rocket', name: 'Rocket Car',     price: 0,    speed: 1.42, handle: 1.2,  grip: 1.2,  shape: 'rocket', un: { streak: 10 }, prizeOnly: true },
];
/* ================= ROCKET CAR FAMILY =================
   Every family car costs ROCKET_PRICE in the garage Cars tab (bought through the one spend() money check).
   Driving one shows a big 🚀 ROCKET button. Each car's power works ONCE per race (tap again next race).
   ability = what the power does (see doRocket() and update() in the race code)
   secs    = how long the power lasts, in seconds
   look    = pixel-art colours: body, fin colour, stripe, flame colour
   desc    = one line for kids, shown in the garage
   The original Rocket Car (10 wins in a row) is the family's big boss and stays prize-only. */
const ROCKET_PRICE = 5000;
const ROCKETS = [
  { id: 'rzoom', name: 'Zoom Rocket', ability: 'zoom', secs: 5, lockSecs: 10, zoomPow: 1.6, pop: '🚀 ZOOM ROCKET!',
    desc: 'Super ZOOM for 5 seconds, and road magnets keep you on the road for 10!', look: { body: '#ff3b3b', fin: '#ffd23f', stripe: '#ffffff', flame: '#ffb21f' } },
  { id: 'rsky', name: 'Sky Sparkle Rocket', ability: 'sky', secs: 5, flyHeight: 450, pop: '✨ SKY SPARKLE!',
    desc: 'Fly up high and go see-through and sparkly - nothing can touch you for 5 seconds!', look: { body: '#7fe6ff', fin: '#ffffff', stripe: '#ff66c4', flame: '#c8f0ff' } },
  { id: 'rsmoky', name: 'Smoky', ability: 'smoke', secs: 6, slowTo: 0.6, range: 10000, pop: '💨 SMOKY PUFF!',
    desc: 'Puffs a big fluffy smoke cloud - cars behind you slow down to peek through it!', look: { body: '#9a9aa8', fin: '#4a4a58', stripe: '#ffd23f', flame: '#dddddd' } },
  { id: 'rmagnet', name: 'Coin Magnet Rocket', ability: 'magnet', secs: 8, reachSegs: 10, pop: '🧲 COIN MAGNET!',
    desc: 'A giant magnet pulls in every coin near you for 8 seconds - cha-ching!', look: { body: '#ffd23f', fin: '#ff3b3b', stripe: '#3b5bff', flame: '#ff8c00' } },
  { id: 'rboing', name: 'Boing Boing Rocket', ability: 'bounce', secs: 5, bounces: 3, jumpPow: 1.5, pop: '🦘 BOING BOING!',
    desc: 'Three giant bouncy jumps right over the other cars!', look: { body: '#5cff7a', fin: '#b066ff', stripe: '#ffffff', flame: '#ff66c4' } },
  { id: 'rbubble', name: 'Slow-Mo Bubble Rocket', ability: 'bubble', secs: 6, slowTo: 0.5, pop: '🫧 SLOW-MO BUBBLE!',
    desc: 'Pops a giant bubble - every other car goes slooow-mo for 6 seconds!', look: { body: '#b066ff', fin: '#7fe6ff', stripe: '#ffffff', flame: '#7fe6ff' } },
];
ROCKETS.forEach(r => CARS.push({ id: r.id, name: r.name, price: ROCKET_PRICE, speed: 1.12, handle: 1.1, grip: 1.1, shape: 'r_' + r.id, rocket: r, body: r.look.body }));
const carPaint = (b, mine) => b.ghost ? '#cfe8ff' : b.body || (mine ? S.paint : '#ff8c00');   // family rockets keep their own colours

const PART_KINDS = { tire: '🛞 Tires', boost: '🔥 Boost', wing: '🪽 Wings', horn: '📯 Horn' };
const PART_NAMES = {
  tire:  [['Bumpy', 'Sticky'], ['Golden Grip', 'Sun Spinner'], ['Diamond Tread', 'Ice Sparkle'], ['Purple Paw', 'Magic Grip'], ['Ruby Roller', 'Lava Wheel']],
  boost: [['Puff', 'Zoom'], ['Golden Nitro', 'Sunburst'], ['Diamond Jet', 'Comet'], ['Amethyst Blaster', 'Thunder'], ['Ruby Rocket', 'Supernova']],
  wing:  [['Paper', 'Bird'], ['Golden Glider', 'Eagle'], ['Diamond Wing', 'Angel'], ['Purple Bat', 'Dragon'], ['Ruby Phoenix', 'Star Wing']],
  horn:  [['Beep', 'Honk'], ['Duck Quack', 'Bike Bell'], ['Trumpet', 'Kazoo'], ['Choo-Choo', 'Air Horn'], ['Freeze Horn', 'Ice Horn']],
};
const PART_UNLOCK = [[null, { races: 1 }], [null, { races: 3 }], [{ races: 4 }, { wins: 3 }], [{ wins: 4 }, { wins: 7 }], [{ wins: 10 }, { wins: 15 }]];
const CATALOG = [];   // every part you can buy: 4 kinds x 5 tiers x 2 styles
for (const kind in PART_NAMES) PART_NAMES[kind].forEach((pair, t) => pair.forEach((name, v) => CATALOG.push({
  key: kind + t + v, kind, t, tier: TIERS[t], name, price: Math.round(ECONOMY.partPrice[TIERS[t]] * (v ? 1.2 : 1)), un: PART_UNLOCK[t][v] })));
const PAINTS = ['#ff2d55', '#ff8c00', '#ffd23f', '#5cff7a', '#00c2ff', '#3b5bff', '#b066ff', '#ff66c4', '#ffffff', '#222222', '#8b5a2b', '#00b3a4'];
const MAPS = [
  { id: 'grass',  name: 'Grassland', emoji: '🌳', stars: 1, seed: 11, curvy: 0.6, hilly: 0.5, side: ['tree', 'bush', 'flowers', 'tree'], obst: ['cone', 'hay'],
    col: { sky: ['#5ec8ff', '#c8f0ff'], g1: '#3fae49', g2: '#379a40', r1: '#6b6b6b', r2: '#656565' } },
  { id: 'desert', name: 'Desert',    emoji: '🌵', stars: 2, seed: 23, curvy: 0.8, hilly: 0.8, side: ['cactus', 'rock', 'cactus', 'weed'], obst: ['cone', 'hay'],
    col: { sky: ['#ffb35c', '#ffe7b0'], g1: '#e9c27a', g2: '#ddb46a', r1: '#8a7457', r2: '#83704f' } },
  { id: 'city',   name: 'City',      emoji: '🏙️', stars: 3, seed: 37, curvy: 1.1, hilly: 0.4, side: ['house', 'lamp', 'house2', 'lamp', 'house3'], obst: ['cone'],
    col: { sky: ['#7aa8ff', '#dfe8ff'], g1: '#8d93a3', g2: '#858b9b', r1: '#3d3d48', r2: '#383843' } },
  { id: 'space',  name: 'Space',     emoji: '🚀', stars: 4, seed: 51, curvy: 1.2, hilly: 1.2, side: ['planet', 'crystal', 'planet2', 'crystal'], obst: ['cone'],
    col: { sky: ['#05031a', '#2a145e'], g1: '#1d1050', g2: '#170c44', r1: '#2f2470', r2: '#2a2066' } },
];
const WEATHER = [{ id: 'sun', name: '☀️ Sunny' }, { id: 'rain', name: '🌧️ Rain - slippy!' }, { id: 'snow', name: '❄️ Snow - slower, grippy' }];

/* ================= SAVE (localStorage) ================= */
const SAVE_KEY = 'raceToWin_v2', OLD_KEY = 'raceToWin_v1';
const uid = () => Math.random().toString(36).slice(2, 9);
let S;
function freshSave() {
  // Archer starts with the Ghost Car (design doc) plus $1,000 to spend.
  const ghost = { id: uid(), base: 'ghost' }, tire = { id: uid(), key: 'tire00', tier: 'normal', broken: false };
  return { v: 2, money: ECONOMY.startMoney, cars: [ghost], parts: [tire], equip: { car: ghost.id, tire: tire.id, boost: null, wing: null, horn: null },
    paint: '#ff2d55', passedTest: false, trophies: [], wins: 0, races: 0, streak: 0, lastDaily: '', luck: { spins: 0, sinceRare: 0, sinceRuby: 0 },
    patches: 0, freePaints: 0, moonTaps: 0, moonBonus: false, lastWeekly: Date.now(), maxMoney: ECONOMY.startMoney,
    settings: { diff: 'normal', autoGo: true, night: 'auto', sound: true } };
}
// Round 1 saves are carried over: money, wins, races, cars, parts, trophies.
function migrateV1(o) {
  const s = freshSave();
  s.money = Math.max(0, Math.floor(o.money || 0)); s.wins = o.wins || 0; s.races = o.races || 0; s.passedTest = !!o.passedTest;
  s.lastDaily = o.lastDaily || ''; s.paint = o.paint || s.paint;
  s.trophies = (o.trophies || []).map(t => ({ map: t.map, tier: TIERS.includes(t.tier) ? t.tier : 'normal' }));
  (o.cars || []).forEach(c => { if (CARS.some(b => b.id === c.base) && c.base !== 'ghost' && c.base !== 'rocket') s.cars.push({ id: c.id, base: c.base }); });
  (o.parts || []).forEach(p => {
    const t = Math.max(0, TIERS.indexOf(p.tier));
    if (p.kind === 'rims') s.money += Math.round(ECONOMY.partPrice[TIERS[t]] * ECONOMY.sellBack);   // rims were removed: refund half
    else if (PART_NAMES[p.kind]) s.parts.push({ id: p.id, key: p.kind + t + '0', tier: TIERS[t], broken: false });
  });
  const e = o.equip || {};
  if (s.cars.some(c => c.id === e.car)) s.equip.car = e.car;
  ['tire', 'boost', 'wing'].forEach(k => { if (s.parts.some(p => p.id === e[k])) s.equip[k] = e[k]; });
  return s;
}
function load() {
  try { S = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 2) {
    let old = null; try { old = JSON.parse(localStorage.getItem(OLD_KEY)); } catch (e) {}
    S = old && old.version ? migrateV1(old) : freshSave();
  }
  const f = freshSave(); S = Object.assign(f, S); S.settings = Object.assign(freshSave().settings, S.settings); S.luck = Object.assign({ spins: 0, sinceRare: 0, sinceRuby: 0 }, S.luck);
  save();
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

/* ================= Small helpers ================= */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const pick = a => a[Math.floor(Math.random() * a.length)];
const cap = s => s[0].toUpperCase() + s.slice(1);
const ord = n => n + ((n % 100 > 10 && n % 100 < 14) ? 'th' : ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'));
const catOf = p => CATALOG.find(c => c.key === p.key);
const partById = id => S.parts.find(p => p.id === id);
const carById = id => S.cars.find(c => c.id === id);
const baseOf = car => CARS.find(b => b.id === car.base);
const myBase = () => baseOf(carById(S.equip.car) || S.cars[0]);
const tierIdx = t => TIERS.indexOf(t);
function equippedTier(kind) { const p = partById(S.equip[kind]); return p && !p.broken ? tierIdx(p.tier) : -1; }
function partLabel(p) { return TIER_ICON[p.tier] + ' ' + catOf(p).name + ' (' + cap(p.tier) + ')'; }
function partPriceNow(p) { return Math.round(ECONOMY.partPrice[p.tier] * (p.key.endsWith('1') ? 1.2 : 1)); }
function unlocked(u) { if (!u) return true; return (!u.wins || S.wins >= u.wins) && (!u.races || S.races >= u.races) && (!u.streak || S.streak >= u.streak); }
function lockText(u) { const a = []; if (u.wins) a.push('Win ' + u.wins + ' race' + (u.wins > 1 ? 's' : '')); if (u.races) a.push('Finish ' + u.races + ' race' + (u.races > 1 ? 's' : '')); if (u.streak) a.push('Win ' + u.streak + ' in a row'); return '🔒 ' + a.join(' + '); }
function hasRainbow() { return ['gold', 'diamond', 'amethyst', 'ruby'].every(t => S.trophies.some(x => x.tier === t)); }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

// The ONE place money is spent. Spends nothing and says so if you can't afford it.
function spend(amount) {
  amount = Math.round(amount);
  if (!(amount >= 0) || S.money < amount) { popup('Not enough money! You need $' + (amount - S.money) + ' more.'); sound('oops'); return false; }
  S.money -= amount; save(); return true;
}
function earn(amount) { S.money += Math.round(amount); S.maxMoney = Math.max(S.maxMoney, S.money); save(); }

/* ================= Sound (tiny beeps made in code, no files) ================= */
let AC = null;
function sound(kind) {
  if (!S || !S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), gn = AC.createGain(), t = AC.currentTime;
    const set = { coin: [880, 1320, .12, 'square'], oops: [300, 150, .25, 'sawtooth'], beep: [520, 520, .3, 'square'], quack: [300, 220, .25, 'sawtooth'],
      ghost: [700, 250, .6, 'sine'], freeze: [1200, 1800, .5, 'triangle'], win: [523, 1046, .5, 'triangle'], go: [660, 990, .3, 'square'], tap: [400, 800, .06, 'triangle'] }[kind] || [440, 440, .2, 'square'];
    o.type = set[3]; o.frequency.setValueAtTime(set[0], t); o.frequency.linearRampToValueAtTime(set[1], t + set[2]);
    gn.gain.setValueAtTime(0.08, t); gn.gain.linearRampToValueAtTime(0, t + set[2]);
    o.connect(gn); gn.connect(AC.destination); o.start(t); o.stop(t + set[2] + 0.02);
  } catch (e) {}
}

/* =====================================================================
   PIXEL ART: every sprite is drawn in code onto a small offscreen

/* ================= Driver actions (buttons) ================= */
const canAct = () => R && R.phase === 'go' && !R.p.finished;

function doBoost() {
  const p = R && R.p; if (!canAct() || p.boostT > 0 || p.ghostT > 0) return;
  if (isBroken('boost')) { addPop('Boost broken! Fix it in the garage', '#ff7a8a'); return; }
  if (myBase().ghost && !p.ghostUsed) {   // Ghost Car: one spooky zoom per race that passes through cars

  }

function luckTable(ctx) { const rb = hasRainbow(); return LUCK.table.map(e => ({ e, w: (e.w[ctx] || 0) * (rb && e.rainbow ? e.rainbow : 1) })).filter(x => x.w > 0); }

  let table = luckTable(ctx);
  if (ctx === 'wheel') {   // pity timers only count wheel spins
    const L = S.luck; L.spins++; L.sinceRare++; L.sinceRuby++;
    if (L.sinceRuby >= LUCK.rubyPity) table = table.filter(x => x.e.id === 'ruby');
    else if (L.sinceRare >= LUCK.pityAfter) table = table.filter(x => x.e.rare && x.e.id !== 'ruby');
  }
  const total = table.reduce((a, x) => a + x.w, 0); let r = Math.random() * total, got = table[table.length - 1].e;
  for (const x of table) { r -= x.w; if (r < 0) { got = x.e; break; } }
  if (ctx === 'wheel') { if (got.rare) S.luck.sinceRare = 0; if (got.id === 'ruby') S.luck.sinceRuby = 0; }
  save(); return got;
}
function oddsWords(p) { const n = Math.max(1, Math.round(1 / p)); return (p >= 0.25 ? 'lots' : p >= 0.1 ? 'often' : p >= 0.04 ? 'sometimes' : p >= 0.02 ? 'rare' : 'super rare') + ', 1 in ' + n; }

  let part = null;
  if (e.id === 'cash50') earn(50); else if (e.id === 'cash150') earn(150);
  else if (e.id === 'paint') S.freePaints++; else if (e.id === 'patch') S.patches++;
  else if (TIERS.includes(e.id)) { part = pick(CATALOG.filter(x => x.tier === e.id && x.key.endsWith('0'))); S.parts.push({ id: uid(), key: part.key, tier: part.tier, broken: false }); }
  save(); return part;
}

/* ================= Main loop (60 fps) ================= */
let last = performance.now();
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (R) {
    let left = real * timeScale;
    while (left > 1e-6 && R) { const step = Math.min(1 / 60, left); update(step); left -= step; }   // small fixed steps keep physics steady
    if (R) { R.frame++; render(); }
  }
  requestAnimationFrame(frame);
}

    const own = S.cars.find(x => x.base === c.id), eq = own && own.id === S.equip.car, open = unlocked(c.un);
    let act;
    if (own) act = (eq ? '<b>✅ Driving</b>' : btn('Drive', 'equipCar', own.id, 'small blue') + btn('Sell $' + Math.round(c.price * ECONOMY.sellBack), 'sellCar', own.id, 'small red'));
    else if (c.prizeOnly) act = '<div class="muted">' + lockText(c.un) + ' (prize only)</div>';
    else act = open ? priceBtn(c.price, 'buyCar', c.id) : '<div class="muted">' + lockText(c.un) + '</div>';
    return '<div class="card ' + (eq ? 'on' : '') + (open || own ? '' : ' lock') + '" style="text-align:center">' + preview(120, 90, c.id) + '<div class="big" style="font-size:21px">' + c.name + (c.ghost ? ' 👻' : '') + (c.rocket ? ' 🚀' : '') + '</div>' + (c.rocket ? '<div style="color:#ffd23f;font-weight:700">🚀 ' + c.rocket.desc + '</div>' : c.id === 'rocket' ? '<div style="color:#ffd23f;font-weight:700">👑 Boss of the Rocket Family!</div>' : '') + '<div class="muted">Speed ' + c.speed + ' · Handling ' + c.handle + ' · Grip ' + c.grip + '</div>' + act + '</div>';
  }).join('');
  if (T === 'paint') return '<div class="card" style="max-width:600px;text-align:center"><p>Paint costs $' + ECONOMY.paintPrice + (S.freePaints ? ' · You have ' + S.freePaints + ' free paint 🎨' : '') + (myBase().ghost ? '<br>(The Ghost Car always looks ghostly!)' : '') + '</p>' +
    PAINTS.map(c => '<button data-act="paint" data-arg="' + c + '" style="width:64px;height:64px;border-radius:50%;margin:6px;border:' + (S.paint === c ? '5px solid #ffd23f' : '3px solid #fff5') + ';background:' + c + '"></button>').join('') + '</div>';
  if (T === 'mine') {
    const parts = S.parts.map(p => {
      const c = catOf(p), eq = S.equip[c.kind] === p.id, ti = tierIdx(p.tier);
      let a = eq ? btn('Take off', 'unequip', c.kind, 'small grey') : btn('Equip', 'equip', p.id, 'small blue');
      if (p.broken) a += S.patches ? btn('Use ruby patch 🩹', 'patch', p.id, 'small green') : priceBtn(fixCost(p), 'fix', p.id, 'Fix');
      if (ti < 4) a += priceBtn(upgradeCost(p), 'upgrade', p.id, 'Upgrade to ' + TIERS[ti + 1]);
      if (!eq) a += btn('Sell $' + Math.round(partPriceNow(p) * ECONOMY.sellBack), 'sellPart', p.id, 'small red');
      return '<div class="card ' + (eq ? 'on' : '') + '"><div class="big" style="font-size:19px">' + PART_KINDS[c.kind].split(' ')[0] + ' ' + partLabel(p) + '</div>' + (p.broken ? '<div style="color:#ff9a9a">🔧 BROKEN</div>' : '') + a + '</div>';
    }).join('');
    return '<div class="card" style="max-width:100%;flex-basis:100%">🩹 Ruby patches: ' + S.patches + ' ' + priceBtn(ECONOMY.patchPrice, 'buyPatch', '', 'Buy patch') + '</div>' + (parts || '<p>No parts yet!</p>');
  }
  return CATALOG.filter(c => c.kind === T).map(c => {
    const open = unlocked(c.un), info = c.kind === 'horn' ? (c.tier === 'ruby' ? '❄️ Rare horn: freezes the car in front for 3s, once a race' : 'Honk honk!') :
      c.kind === 'boost' ? TIER_STATS.turbo[c.t] + 's turbo · uses ' + TIER_STATS.fuel[c.t] + '% fuel' : c.kind === 'wing' ? 'Glide ' + TIER_STATS.glide[c.t] + 's' : '+' + (c.t * 8) + '% grip, +' + (c.t * 2.5) + '% speed';
    return '<div class="card' + (open ? '' : ' lock') + '" style="text-align:center"><div class="big" style="font-size:20px">' + TIER_ICON[c.tier] + ' ' + c.name + '</div><div>' + cap(c.tier) + '</div><div class="muted">' + info + '</div>' + (open ? priceBtn(c.price, 'buyPart', c.key) : '<div class="muted">' + lockText(c.un) + '</div>') + '</div>';
  }).join('');
}
function fixCost(p) { return catOf(p).kind === 'tire' ? (p.tier === 'ruby' ? ECONOMY.pit.rubyTire : ECONOMY.pit.tire) : Math.round(partPriceNow(p) * ECONOMY.fixOtherPart); }
function upgradeCost(p) { return Math.round(ECONOMY.partPrice[TIERS[tierIdx(p.tier) + 1]] - ECONOMY.partPrice[p.tier] * ECONOMY.upgradeDiscount); }
function drawPreviews() {
  document.querySelectorAll('canvas.prev').forEach(c => {
    const x = c.getContext('2d'), mine = !c.dataset.shape, b = mine ? myBase() : CARS.find(q => q.id === c.dataset.shape), tire = partById(S.equip.tire);
    const spr = carSprite(b.shape, carPaint(b, mine), mine && tire ? TIER_COLOR[tire.tier] : '#2b2b2b');
    x.imageSmoothingEnabled = false; x.clearRect(0, 0, c.width, c.height); x.globalAlpha = b.ghost ? 0.7 : 1;
    x.drawImage(spr, c.width * 0.08, c.height * 0.1, c.width * 0.84, c.width * 0.84 * 30 / 40);
  });
  const w = $('wheel'); if (w) drawWheel(w);
}
function drawWheel(c) {   // slice sizes match the real odds, so ruby really is a thin slice
  const x = c.getContext('2d'), rows = luckTable('wheel'), total = rows.reduce((a, r) => a + r.w, 0), cols = ['#ffd23f', '#5bd0ff', '#6cf08a', '#ff9a5a', '#b066ff', '#ff66c4'];
  let a = -Math.PI / 2;
  rows.forEach((r, i) => { const da = r.w / total * Math.PI * 2; x.fillStyle = r.e.id === 'ruby' ? '#ff2a4d' : cols[i % cols.length]; x.beginPath(); x.moveTo(150, 150); x.arc(150, 150, 145, a, a + da); x.closePath(); x.fill();
    if (da > 0.3) { x.save(); x.translate(150, 150); x.rotate(a + da / 2); x.font = '22px sans-serif'; x.fillText(r.e.icon, 95, 8); x.restore(); } r.a0 = a; r.a1 = a + da; a += da; });
  x.fillStyle = '#fff'; x.beginPath(); x.arc(150, 150, 18, 0, 7); x.fill();
  drawWheel.rows = rows;
}

/* ================= Button actions ================= */
const ACT = {
  go: s => show(s),
  tab: t => { garageTab = t; show('garage'); },
  diff: d => { S.settings.diff = d; save(); show('home'); },
  autoGo: v => { S.settings.autoGo = v === 'on'; save(); show('home'); },
  night: n => { S.settings.night = n; save(); show('home'); },
  sound: v => { S.settings.sound = v === 'on'; save(); show('home'); },
  buyCar: id => { const c = CARS.find(x => x.id === id); if (!c || c.prizeOnly || !unlocked(c.un) || S.cars.some(x => x.base === id) || !spend(c.price)) return;
    const car = { id: uid(), base: id }; S.cars.push(car); S.equip.car = car.id; save(); popup('🎉 You bought the ' + c.name + '!'); show('garage'); },
  equipCar: id => { if (carById(id)) { S.equip.car = id; save(); show('garage'); } },
  sellCar: id => { const car = carById(id); if (!car || S.cars.length < 2 || S.equip.car === id) return; S.cars = S.cars.filter(x => x !== car); earn(baseOf(car).price * ECONOMY.sellBack); show('garage'); },
  buyPart: key => { const c = CATALOG.find(x => x.key === key); if (!c || !unlocked(c.un) || !spend(c.price)) return;
    const p = { id: uid(), key, tier: c.tier, broken: false }; S.parts.push(p); S.equip[c.kind] = p.id; save(); popup('🎉 ' + c.name + ' equipped!'); show('garage'); },
  equip: id => { const p = partById(id); if (p) { S.equip[catOf(p).kind] = id; save(); show('garage'); } },
  unequip: kind => { S.equip[kind] = null; save(); show('garage'); },
  sellPart: id => { const p = partById(id); if (!p || Object.values(S.equip).includes(id)) return; S.parts = S.parts.filter(x => x !== p); earn(partPriceNow(p) * ECONOMY.sellBack); show('garage'); },
  upgrade: id => { const p = partById(id); if (!p || tierIdx(p.tier) >= 4 || !spend(upgradeCost(p))) return; p.tier = TIERS[tierIdx(p.tier) + 1]; save(); popup('✨ Upgraded to ' + p.tier + '!'); show('garage'); },
  fix: id => { const p = partById(id); if (!p || !p.broken || !spend(fixCost(p))) return; p.broken = false; save(); show('garage'); },
  patch: id => { const p = partById(id); if (!p || !p.broken || S.patches < 1) return; S.patches--; p.broken = false; save(); popup('🩹 Patched!'); show('garage'); },
  buyPatch: () => { if (spend(ECONOMY.patchPrice)) { S.patches++; save(); show('garage'); } },
  paint: c => { if (S.paint === c) return; if (S.freePaints > 0) S.freePaints--; else if (!spend(ECONOMY.paintPrice)) return; S.paint = c; save(); show('garage'); },
  practice: () => startRace({ mode: 'practice', map: 'grass' }),
  raceMenu: () => { if (!S.passedTest) return; raceSetup = { map: 'grass', weather: pick(WEATHER).id }; show('raceMenu'); },
  pickMap: id => { raceSetup.map = id; raceSetup.grid = null; show('raceMenu'); },
  qualify: () => startRace({ mode: 'qualify', map: raceSetup.map, weather: raceSetup.weather }),
  startRace: () => startRace({ mode: 'race', map: raceSetup.map, weather: raceSetup.weather, grid: raceSetup.grid }),
  spin: () => spinWheel(),
  sellTrophy: i => { const t = S.trophies[+i]; if (!t) return; S.trophies.splice(+i, 1); earn(ECONOMY.trophySell[t.tier]); show('trophies'); },
  prize: key => { const c = CATALOG.find(x => x.key === key); if (!c || !resultsPrize) return; resultsPrize = null; S.parts.push({ id: uid(), key, tier: c.tier, broken: false }); save(); popup('🎁 ' + c.name + ' is in My parts!'); show('home'); },
};
$('ui').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; sound('tap'); const f = ACT[b.dataset.act]; if (f) f(b.dataset.arg); });

function spinWheel() {
  if (!dailyReady()) return;
  S.lastDaily = today(); earn(ECONOMY.dailyCash);
  const e = roll('wheel'), w = $('wheel'), r = drawWheel.rows.find(x => x.e === e);
  const mid = (r.a0 + r.a1) / 2 + Math.PI / 2;   // spin so the arrow at the top lands on our prize
  w.style.transform = 'rotate(' + (360 * 5 - mid * 180 / Math.PI) + 'deg)';
  $('ui').querySelector('[data-act=spin]').disabled = true;
  setTimeout(() => { const part = givePrize(e); popup('🎉 +$' + ECONOMY.dailyCash + ' and... ' + e.icon + ' ' + e.label + (part ? ': ' + part.name : '') + '!', 3500); show('wheel'); }, 3100);
}

/* ================= Results ================= */
function moneyTable(rows, total) { return '<div class="card" style="margin:10px auto;max-width:460px"><table class="odds" style="width:100%">' + rows.map(x => '<tr><td>' + x[0] + '</td><td style="text-align:right">' + (x[1] < 0 ? '-$' + -x[1] : '$' + x[1]) + '</td></tr>').join('') + '<tr><td><b>Total</b></td><td style="text-align:right"><b>$' + total + '</b></td></tr></table></div>'; }
function unlockSnapshot() { return [...CARS.filter(c => c.un && !c.prizeOnly && unlocked(c.un)).map(c => c.name), ...CATALOG.filter(c => c.un && unlocked(c.un)).map(c => c.name)]; }
function showResults() {
  const r = R; R = null; setPad(false); Object.keys(keys).forEach(k => keys[k] = false);
  const place = r.p.place, m = r.map, before = unlockSnapshot(), rows = [], coinCash = Math.round(r.coins * ECONOMY.coinValue);
  let extra = '', total = 0;
  const h2 = s => '<h2 style="text-align:center">' + s + '</h2>';
  if (r.mode === 'qualify') {
    // bots' lap times come from their speed; fastest lap starts at the front
    const lvl = DIFFICULTY.levels[S.settings.diff], times = DIFFICULTY.mapSkill[m.id].map(sk => r.track.len / (BASE_MAX * sk * lvl * 0.95) + 3 + Math.random() * 2);
    const all = [{ n: 'you', t: r.finishTime }, ...times.map((t, i) => ({ n: i, t }))].sort((a, b) => a.t - b.t);
    raceSetup.grid = all.map(x => x.n); const pos = raceSetup.grid.indexOf('you') + 1;
    if (pos === 1) rows.push(['Pole position prize', ECONOMY.polePrize]);
    rows.push(['Coins (' + r.coins + ')', coinCash]); rows.forEach(x => total += x[1]); earn(total);
    resultsHTML = '<h1>⏱️ Qualifying: ' + r.finishTime.toFixed(1) + 's</h1>' + h2('You start ' + ord(pos) + ' on the grid!') +
      '<div class="card" style="margin:auto;max-width:460px">' + all.map((x, i) => (i + 1) + '. ' + (x.n === 'you' ? '<b>You</b>' : ['Zippy', m.id === 'city' ? 'Officer Vroom' : 'Rusty', 'Bubbles'][x.n]) + ' - ' + x.t.toFixed(1) + 's').join('<br>') + '</div>' +
      moneyTable(rows, total) + center(btn('🏁 Start the race!', 'startRace', '', 'green') + btn('Home', 'go', 'home', 'grey'));
    show('results'); return;
  }
  S.races++;
  if (r.mode === 'practice') {
    const pass = place === 1;
    if (pass && !S.passedTest) { S.passedTest = true; rows.push(['Practice test passed!', ECONOMY.practicePrize]); }
    rows.push(['Coins (' + r.coins + ')', coinCash]);
    extra = pass ? h2('✅ You beat the practice bot! Real races are open!') : h2('So close! Try again - you can do it! 💪');
  } else {
    const placePrize = ECONOMY.placePrize[place - 1] || 0;
    rows.push([ord(place) + ' place prize', placePrize], [m.name + ' bonus' + (r.laps > 2 ? ' + ' + r.laps + '-lap bonus' : ''), Math.round(placePrize * prizeMult(m)) - placePrize], ['Coins (' + r.coins + ')', coinCash]);
    if (place === 1) {
      S.wins++; S.streak++;
      const tire = partById(S.equip.tire), tier = tire ? tire.tier : 'normal';
      S.trophies.push({ map: m.name, tier }); extra += h2('🏆 ' + cap(tier) + ' trophy added!');
      const tiers = ECONOMY.prizeTiers[m.id];
      resultsPrize = [0, 1, 2].map(() => pick(CATALOG.filter(c => c.tier === pick(tiers) && c.key.endsWith('0'))));
      extra += h2('🎁 Pick one prize part:') + '<div class="row">' + resultsPrize.map(c => '<div class="card" style="text-align:center">' + PART_KINDS[c.kind] + '<div class="big" style="font-size:20px">' + TIER_ICON[c.tier] + ' ' + c.name + '</div>' + btn('Pick this!', 'prize', c.key, 'small green') + '</div>').join('') + '</div>';
      if (S.streak >= 10 && !S.cars.some(c => c.base === 'rocket')) { S.cars.push({ id: uid(), base: 'rocket' }); extra += h2('🚀 10 wins in a row! You earned the ROCKET CAR!'); }
    } else S.streak = 0;
    if (place === r.bots.length + 1) { const t = partById(S.equip.tire); if (t && !t.broken) { t.broken = true; extra += '<p style="text-align:center">Last place: your tire got a puncture. Fix it in My parts 🔧</p>'; } }
  }
  if (r.pitPaid) rows.push(['Pit stop (paid in the race)', -r.pitPaid]);
  rows.forEach(x => total += x[1]); earn(total + r.pitPaid);   // pit money was already taken during the race
  S.parts.forEach(p => { if (p.broken && Object.values(S.equip).includes(p.id)) extra += '<p style="text-align:center">🔧 Your ' + catOf(p).name + ' is broken. Fix it in the garage.</p>'; });
  const news = unlockSnapshot().filter(x => !before.includes(x));
  if (news.length) extra += h2('🔓 New in the garage: ' + news.join(', '));
  save();
  const sub = m.name + ' · ' + WEATHER.find(w => w.id === r.weather).name + (r.night ? (r.blood ? ' · 🔴 Blood moon' : ' · 🌙 Night') : '') + ' · ' + r.finishTime.toFixed(1) + 's';
  resultsHTML = '<h1>' + (place === 1 ? '🥇 You WON!' : '🏁 You came ' + ord(place)) + '</h1><p style="text-align:center">' + sub + '</p>' + moneyTable(rows, total) + extra +
    (r.mode === 'race' && place === 1 ? '' : center(btn('🏠 Home', 'go', 'home', 'blue') + btn('🔧 Garage', 'go', 'garage') + (r.mode === 'practice' && place > 1 ? btn('🤖 Try again', 'practice', '', 'green') : '')));
  show('results');
}

/* ================= Weekly trophy pay ================= */
function weeklyPay() {
  const weeks = Math.floor((Date.now() - S.lastWeekly) / (7 * 864e5)); if (weeks < 1) return;
  S.lastWeekly += weeks * 7 * 864e5;
  const pay = weeks * S.trophies.reduce((a, t) => a + ECONOMY.trophyWeekly[t.tier], 0);
  if (pay > 0) { earn(pay); setTimeout(() => popup('🏆 Your trophies paid you $' + pay + '!', 3500), 300); } else save();
}

/* ================= Start ================= */
load(); weeklyPay(); buildPad(); resize(); addEventListener('resize', resize);
document.addEventListener('gesturestart', e => e.preventDefault());
if (S.races === 0 && !S.passedTest) garageTab = 'cars';
show(S.races === 0 && !S.passedTest ? 'garage' : 'home');   // first time: open in the garage (design doc)
requestAnimationFrame(frame);
window.RTW = { get S() { return S; }, get R() { return R; }, set timeScale(v) { timeScale = v; }, startRace, ACT, roll, show, save, keys, ROCKETS, ROCKET_PRICE };   // for testing only
</script>
